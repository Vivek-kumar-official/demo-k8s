apiVersion: v1
kind: Pod
metadata:
  name: traffic-client
spec:
  restartPolicy: Never
  containers:
  - name: traffic
    image: curlimages/curl:8.2.1
    command:
      - "sh"
      - "-c"
      - |
        while true; do
          ts=$(date -Is)
          out=$(curl -sS -m 2 -w "|||%{http_code}|||%{time_total}" http://demo-service:8080/version) || out="|||ERR|||0"
          body=${out%%|||*}
          rest=${out#*|||}
          code=${rest%%|||*}
          time=${rest##*|||}
          # structured single-line log: ISO timestamp, status, time(s), body(JSON or empty)
          echo "$ts status=$code time=$time body=$body"
          sleep 1
        done
